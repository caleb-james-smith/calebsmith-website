      <h1>Physics</h1>

      <figure>
        <img src="images/physics/StandardModel.png" alt="Standard Model">
        <figcaption>Table of the Standard Model (SM) of elementary particles.</figcaption>
      </figure>

      <figure>
        <img src="images/physics/Supersymmetry.jpg" alt="Supersymmetry">
        <figcaption>
          Elementary particles in supersymmetry (SUSY),
          with the Standard Model particles on the left
          and their supersymmetric counterparts on the right.
        </figcaption>
      </figure>

      <figure>
        <img src="images/physics/CERNAcceleratorComplex.jpg" alt="CERN Accelerator Complex">
        <figcaption>Overview of the accelerator complex at CERN.</figcaption>
      </figure>

      <figure>
        <img src="images/physics/CMSSlice.png" alt="Transverse slice through CMS">
        <figcaption>
          Diagram representing a transverse slice through the Compact Muon Solenoid (CMS) experiment.
          Examples of different types of particles and their interactions with subdetectors are shown.
        </figcaption>
      </figure>

      <figure>
        <img src="images/physics/CMS_image_001.jpg" alt="Baylor team at CMS 1">
        <figcaption>
          Some of the Baylor CMS team at CMS.
          From left to right: Jay Dittmann, Kenichi Hatakeyama, Caleb Smith, and Joe Pastika. (2017)
        </figcaption>
      </figure>
      
      <figure>
         <div class="hover-figure">
          <img src="images/physics/CMS_image_002.jpg" alt="Caleb at CMS 1" class="base">
          <img src="images/physics/CMS_image_003.jpg" alt="" class="hover">
         </div>
        <figcaption>
          Me at CMS, with the barrel on the left, one of the two endcaps on the right,
          and the Large Hadron Collider (LHC) beamline in the center. (2017)
        </figcaption>
      </figure>

      <figure>
        <img src="images/physics/CMS_image_004.jpg" alt="Caleb at CMS 2">
        <figcaption>
          Me at CMS, on the ground of the experimental cavern.
          Behind me, there are collaborators in a cherry picker working on one of the Hadron Calorimeter (HCAL) endcaps. (2017)
        </figcaption>
      </figure>
      
      <figure>
        <img src="images/physics/CMS_image_005.jpg" alt="Baylor team at CMS 2">
        <figcaption>
          Some of the Baylor CMS team in a scissor lift next to one of the endcaps.
          From left to right: Joe Pastika, Jay Dittmann, and Caleb Smith. (2018)
        </figcaption>
